name: Update README cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats (dark)
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=touhidurabir&show_icons=true&hide_border=true&hide_rank=true&include_all_commits=true&show=reviews,prs_merged&theme=github_dark&custom_title=github stats
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats (light)
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=touhidurabir&show_icons=true&hide_border=true&hide_rank=true&include_all_commits=true&show=reviews,prs_merged&theme=default&custom_title=github stats
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
